  <rect x="40" y="1590" width="1420" height="100" rx="12" fill="#0f172a"/>
  <text x="64" y="1626" font-size="15" font-weight="700" fill="#ffffff">结论：渐进式加载优化的是「上下文 token」，不是磁盘 IO。</text>
  <text x="64" y="1654" font-size="12.5" fill="#cbd5e1">SkillScanner 扫描时已把每个 SKILL.md 全文读进内存（fullContent）；read_skill 决定的只是「这段文本何时进入 prompt」。</text>
